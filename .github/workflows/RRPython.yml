name: Run Mode Matching T10000

on:
  push:
    paths:
      - 'experiments/03_t10000_mode_matching/mode_matching_t10000.py'
      - '.github/workflows/run_mode_matching_t10000.yml'
  workflow_dispatch:

jobs:
  run-mode-matching:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Run mode matching script
        run: |
          python experiments/03_t10000_mode_matching/mode_matching_t10000.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/03_t10000_mode_matching/output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update mode matching output for t=10000"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

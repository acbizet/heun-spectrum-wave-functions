name: Run Experiments and Commit

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Which experiment to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - basic
          - large-t
          - t10000
          - first-correction

permissions:
  contents: write

jobs:
  run_experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run selected experiment
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python run_all.py "${{ inputs.case }}"

      - name: Check for changes
        id: check_changes
        shell: bash
        run: |
          if git diff --quiet -- .; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated files
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git add -A
          git commit -m "Results from ${{ inputs.case }} experiment run"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin HEAD:main
